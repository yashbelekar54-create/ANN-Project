project:
  name: Intelligent Document Classification System
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  processed_csv: data/processed/newsgroups_processed.csv
  models_dir: models
  model_file: models/document_classifier.keras
  vectorizer_file: models/tfidf_vectorizer.joblib
  label_encoder_file: models/label_encoder.joblib
  training_config_file: models/training_config.json
  category_mapping_file: models/category_mapping.json
  preprocessing_config_file: models/preprocessing_config.json
  figures_dir: results/figures
  metrics_dir: results/metrics
  reports_dir: results/reports
  training_history_file: results/metrics/training_history.json
  dataset_summary_file: results/metrics/dataset_summary.json
  history_file: logs/prediction_history.csv

data:
  expected_num_classes: 20
  # Passed to fetch_20newsgroups(remove=...) for the primary (leakage-safe) text.
  metadata_to_remove: [headers, footers, quotes]
  validation_size: 0.15

preprocessing:
  # Heuristic header / quote / signature stripping for documents submitted in the app.
  strip_metadata_on_inference: true

tfidf:
  max_features: 15000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  sublinear_tf: true
  stop_words: english
  token_pattern: "(?u)\\b[a-z0-9]{2,}\\b"

model:
  hidden_units: [256, 128]
  dropout: [0.40, 0.30]
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 40
  early_stopping_patience: 5
  reduce_lr_patience: 2
  reduce_lr_factor: 0.5
  min_lr: 0.00001

ablation:
  # Metadata with/without comparison is scored on the VALIDATION split only.
  epochs: 12

inference:
  top_k: 5
  max_upload_mb: 10
  min_words_warning: 20
  low_confidence_threshold: 0.50
